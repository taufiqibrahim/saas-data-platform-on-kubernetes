apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "principal"
  rules:
    - actions:
        - "iam:listPrincipals"
      effect: EFFECT_ALLOW
      roles:
        - "SystemRole"
      condition:
        match:
          expr: '"SystemRole" in request.principal.attr.system_roles'
