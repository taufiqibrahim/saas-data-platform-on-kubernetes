name: saas

networks:
  saas:
    name: saas-net
#     driver: bridge
#     ipam:
#       config:
#         - subnet: 172.30.0.0/16
#           gateway: 172.30.0.1

volumes:
  caddy_data:
  caddy_config:
  etcd_data:
  zot_data:

services:

  step-ca-init:
    image: smallstep/step-cli:0.23.0
    container_name: step-ca-init
    profiles: ["init"]  # <--- This hides it from normal 'up'
    network_mode: host
    env_file:
      - .env
    # entrypoint: ["/bin/bash", "-c"]
    command:
      - /bin/bash
      - -c
      - |
        echo "$STEPCA_PASSWORD" > /home/step/secrets/password
        step ca init --name 'Local SaaS CA' \
          --provisioner admin \
          --dns localhost \
          --dns ca.saas.internal \
          --address ':9000' \
          --issuer https://ca.saas.internal:9000 \
          --password-file /home/step/secrets/password
        step ca provisioner add acme --type ACME --ca-config /home/step/config/ca.json
    volumes:
      - ./docker/step-ca:/home/step
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  step-ca:
    image: smallstep/step-ca:0.29.0
    container_name: step-ca
    network_mode: host
    volumes:
      - ./docker/step-ca:/home/step
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd
    network_mode: host
    env_file:
      - .env
    environment:
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://${DOCKER_HOST_IP}:2379
      - ETCD_LOG_LEVEL=debug
    volumes:
      - etcd_data:/var/lib/etcd # Add volume mapping so DNS records will survive on pod restart
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  coredns:
    image: coredns/coredns
    container_name: coredns
    network_mode: host
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./docker/coredns:/etc/coredns
    env_file:
      - .env
    restart: always
    depends_on:
      - etcd
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mkdocs:
    image: squidfunk/mkdocs-material:latest
    container_name: mkdocs
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml
      - ./docs:/docs/docs
    command:
      - serve
      - --livereload
      - --dev-addr=0.0.0.0:8000
    restart: unless-stopped
    depends_on:
      - step-ca
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  static:
    image: nginx:alpine
    container_name: static
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static/index.html:/srv/saas/index.html:ro
      - ./static/403.html:/srv/saas/403.html:ro
      - ./static/404.html:/srv/saas/404.html:ro
      - ./static/kubevela-addons:/srv/saas/kubevela-addons:ro
      - ./deployments/tenants:/srv/saas/tenants:ro
    restart: always
    depends_on:
      - step-ca
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10.2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./docker/step-ca/certs:/step-ca-certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - step-ca
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openbao:
    image: quay.io/openbao/openbao:latest
    container_name: openbao
    cap_add:
      - IPC_LOCK
    user: "100:1000"
    command: server -config=/bao/config/config.hcl
    volumes:
      - ./docker/openbao/config.hcl:/bao/config/config.hcl:ro
      - ./docker/openbao/data:/mnt/openbao/data
    depends_on:
      - step-ca
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  zot:
    image: ghcr.io/project-zot/zot:v2.1.14
    container_name: zot
    # ports:
    #   - "5000:5000"
    depends_on:
      - step-ca
    volumes:
      - ./docker/zot/zot-config.json:/etc/zot/config.json:ro
      - ./docker/zot/htpasswd:/auth/data/htpasswd:ro
      - ./docker/zot/credentials.json:/etc/zot/credentials.json:ro
      - zot_data:/var/lib/zot
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    volumes:
      - ./docker/rustfs/data:/data
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_OBS_LOGGER_LEVEL=warn
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloud-provider:
    image: cloud-provider-kind
    container_name: cloud-provider
    # network_mode: "${NET_MODE-host}"
    network_mode: kind
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
