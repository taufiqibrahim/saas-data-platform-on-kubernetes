---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-tenant-agent-controller
  namespace: saas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-agent-controller-role-cluster
rules:

  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs: [list, watch, patch, get]

  # Framework: runtime observation of namespaces & CRDs (addition/deletion).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch, get, create, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch, get, create]

  # Framework: admission webhook configuration management.
  - apiGroups: [admissionregistration.k8s.io/v1, admissionregistration.k8s.io/v1beta1]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [create, patch]

  # Application: platform custom resources (cross-namespace).
  - apiGroups: [platform.saas.internal]
    resources: [workspaces, workspaces/status, workspaceapplications, workspaceapplications/status]
    verbs: [list, watch, get, create, patch, update, delete]

  # Application: events for custom resources in workload namespace.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: KubeVela addon management.
  - apiGroups: [core.oam.dev]
    resources: [applications]
    verbs: [list, watch, get, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-agent-controller-role-namespaced
  namespace: saas-system
rules:

  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [kopf.dev]
    resources: [kopfpeerings]
    verbs: [list, watch, patch, get]

  # Framework: posting the events about the handlers progress/errors.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-agent-controller-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-agent-controller-role-cluster
subjects:
  - kind: ServiceAccount
    name: sa-tenant-agent-controller
    namespace: saas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: saas-system
  name: tenant-agent-controller-rolebinding-namespaced
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-agent-controller-role-namespaced
subjects:
  - kind: ServiceAccount
    name: sa-tenant-agent-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-agent-controller
  namespace: saas-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      application: tenant-agent-controller
  template:
    metadata:
      labels:
        application: tenant-agent-controller
    spec:
      serviceAccountName: sa-tenant-agent-controller
      containers:
        - name: controller
          image: zot.saas.internal/saas/tenant-agent-controller:0.0.6
          envFrom:
            - configMapRef:
                name: tenant-agent-controller-config
          volumeMounts:
            - name: mtls-certs
              mountPath: /etc/certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 400Mi
      volumes:
        - name: mtls-certs
          secret:
            secretName: agent-mtls-secret
