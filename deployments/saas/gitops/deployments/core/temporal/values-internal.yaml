server:
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: postgres12
            databaseName: temporal
            host: _HOST_
            port: 5432
            user: temporal
            existingSecret: temporal-db-credentials
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          sql:
            pluginName: postgres12
            databaseName: temporal_visibility
            host: _HOST_
            port: 5432
            user: temporal
            existingSecret: temporal-db-credentials
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"

  frontend:
    metrics:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

  history:
    metrics:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

  matching:
    metrics:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

  worker:
    metrics:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
admintools:
  enabled: true
web:
  enabled: true