global:
  imageRegistry: docker.io
  imagePullSecrets:
  - dockerio-image-pull-secret

keycloak:
  hostname: "auth.saas.internal"
  production: true
  proxyHeaders: "xforwarded"
  existingSecret: "keycloak-credentials"
  secretKeys:
    adminPasswordKey: "admin-password"

database:
  type: "postgres"
  host: "keycloak-db-rw.saas-system.svc.cluster.local"
  existingSecret: "keycloak-db-credentials"
  secretKeys:
    passwordKey: "password"
    usernameKey: "username"

# Disable embedded databases
postgres:
  enabled: false
mariadb:
  enabled: false